<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Amazon Shopping Assistant</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: #0f172a; color: #e2e8f0; height: 100vh; display: flex; justify-content: center; }

    .chat-container {
      width: 100%; max-width: 820px; height: 100vh;
      display: flex; flex-direction: column; background: #1e293b;
      border-left: 1px solid #334155; border-right: 1px solid #334155;
    }

    header {
      padding: 16px 20px; background: #131921; border-bottom: 1px solid #334155;
      display: flex; justify-content: space-between; align-items: center;
    }
    header h1 { font-size: 18px; color: #ff9900; }
    header button {
      background: #334155; color: #e2e8f0; border: none; padding: 6px 12px;
      border-radius: 6px; cursor: pointer; font-size: 13px;
    }
    header button:hover { background: #475569; }

    #messages {
      flex: 1; overflow-y: auto; padding: 20px;
      display: flex; flex-direction: column; gap: 14px;
    }

    .msg {
      max-width: 80%; padding: 12px 16px; border-radius: 12px;
      line-height: 1.5; font-size: 14.5px; white-space: pre-wrap; word-wrap: break-word;
    }
    .msg.user { align-self: flex-end; background: #ff9900; color: #111827; font-weight: 500; }
    .msg.bot { align-self: flex-start; background: #0f172a; border: 1px solid #334155; color: #e2e8f0; }
    .msg.bot a { color: #38bdf8; text-decoration: underline; }

    .typing { font-style: italic; color: #94a3b8; }

    form {
      display: flex; gap: 10px; padding: 16px;
      background: #131921; border-top: 1px solid #334155;
    }
    input {
      flex: 1; padding: 12px 14px; border-radius: 8px; border: 1px solid #475569;
      background: #0f172a; color: #fff; font-size: 15px; outline: none;
    }
    input:focus { border-color: #ff9900; }
    button[type="submit"] {
      padding: 12px 20px; border: none; border-radius: 8px;
      background: #ff9900; color: #111827; font-weight: 600; cursor: pointer;
    }
    button[type="submit"]:disabled { opacity: 0.5; cursor: not-allowed; }
  </style>
</head>
<body>
  <div class="chat-container">
    <header>
      <h1>Amazon Shopping Assistant</h1>
      <button id="newChatBtn" type="button">New Chat</button>
    </header>

    <div id="messages">
      <div class="msg bot">Hi! Ask me to find any product on Amazon India—phones, clothes, shoes, gadgets, anything.</div>
    </div>

    <form id="chatForm">
      <input id="userInput" type="text" placeholder="e.g., Best men's cotton t-shirts under 1000..." autocomplete="off" required />
      <button id="sendBtn" type="submit">Send</button>
    </form>
  </div>

  <script>
    const messagesEl = document.getElementById("messages");
    const form = document.getElementById("chatForm");
    const input = document.getElementById("userInput");
    const sendBtn = document.getElementById("sendBtn");
    const newChatBtn = document.getElementById("newChatBtn");

    let threadId = "session_" + Date.now();

    function formatText(text) {
      const escaped = text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
      return escaped
        .replace(/\*\*(.*?)\*\*/g, "<strong>$1</strong>")
        .replace(/(https?:\/\/[^\s]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');
    }

    function addMessage(text, sender, isTyping = false) {
      const div = document.createElement("div");
      div.className = `msg ${sender}` + (isTyping ? " typing" : "");
      if (sender === "bot" && !isTyping) {
        div.innerHTML = formatText(text);
      } else {
        div.textContent = text;
      }
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
      return div;
    }

    newChatBtn.addEventListener("click", () => {
      threadId = "session_" + Date.now();
      messagesEl.innerHTML = '<div class="msg bot">Started a fresh chat. What are you shopping for?</div>';
    });

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text) return;

      addMessage(text, "user");
      input.value = "";
      sendBtn.disabled = true;

      const loadingMsg = addMessage("Searching Amazon...", "bot", true);

      try {
        const res = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: text, thread_id: threadId }),
        });
        const data = await res.json();
        loadingMsg.remove();
        addMessage(data.reply || "No response received.", "bot");
      } catch (err) {
        loadingMsg.remove();
        addMessage("Failed to connect to server. Is FastAPI running?", "bot");
      } finally {
        sendBtn.disabled = false;
        input.focus();
      }
    });
  </script>
</body>
</html>
